[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mozg-outreach"
version = "0.1.0"
description = "Local outreach service: brief-driven discovery, scoring, enrichment and naturalized drafts"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.20,<2",
  "claude-agent-sdk>=0.2.182,<0.3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "sqlalchemy>=2.0.40,<3",
  "sse-starlette>=2.1,<4",
  "telethon>=1.40,<2",
  "uvicorn>=0.32,<1",
]


[project.scripts]
mozg-outreach = "mozg_outreach.api.__main__:main"

[dependency-groups]
dev = [
  "mypy>=1.20,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.0,<2",
  "ruff>=0.13,<0.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mozg_outreach"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers -m 'not live'"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: calls the real Claude Code CLI and the web; run with `-m live`"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ANN", "B", "E", "F", "I", "PT", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "telethon.*"
ignore_missing_imports = true
